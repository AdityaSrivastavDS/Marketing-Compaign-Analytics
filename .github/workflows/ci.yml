name: QA Validation & Integrity Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Verify Datasets and Power BI Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Data Analysis Verification
        run: node scripts/analyze.js

      - name: Run QA Validation Suite
        run: node scripts/validate_solution.js
